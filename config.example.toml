# Copy this file to config.toml and fill in the password.
# config.toml is git-ignored: never commit it.

[console]
host = "127.0.0.1"   # onPC on this PC
port = 30000         # grandMA2 remote command line (Telnet)
user = "toolkit"     # MA user created for this tool
password = ""        # the MA user's password (or set the MA2KIT_PASSWORD environment variable)
timeout = 5.0        # seconds to wait for a command's reply

[log]
# Every command sent is appended here (password masked). Relative to this file.
transcript = "logs/transcript.log"
