<svg xmlns="http://www.w3.org/2000/svg" width="1035" height="745" viewBox="0 0 1035 745" role="img" aria-label="ma2kit  —  Plugins submenu">
<rect width="1035" height="745" rx="8" fill="#1e1f26"/>
<rect width="1035" height="34" rx="8" fill="#2b2d36"/><rect y="26" width="1035" height="8" fill="#2b2d36"/>
<circle cx="18" cy="17" r="6" fill="#ff5f57"/><circle cx="38" cy="17" r="6" fill="#febc2e"/><circle cx="58" cy="17" r="6" fill="#28c840"/>
<text x="518" y="22" fill="#8a8f9c" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle">ma2kit  —  Plugins submenu</text>
<g font-family="Cascadia Mono, Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="14">
<text x="18" y="64" xml:space="preserve"><tspan fill="#ffcf6b">ma2kit - grandMA2 toolkit</tspan></text>
<text x="18" y="83" xml:space="preserve"><tspan fill="#d6d8df">  127.0.0.1:30000  user toolkit  show demo_show (may be changed)</tspan></text>
<text x="18" y="102" xml:space="preserve"><tspan fill="#d6d8df">   1  Status check (connection, login, show)</tspan></text>
<text x="18" y="121" xml:space="preserve"><tspan fill="#d6d8df">   2  Show summary</tspan></text>
<text x="18" y="140" xml:space="preserve"><tspan fill="#d6d8df">   3  List fixtures</tspan></text>
<text x="18" y="159" xml:space="preserve"><tspan fill="#d6d8df">   4  Browse a pool</tspan></text>
<text x="18" y="178" xml:space="preserve"><tspan fill="#d6d8df">   5  Group members</tspan></text>
<text x="18" y="197" xml:space="preserve"><tspan fill="#d6d8df">   6  Check the show (patch, names)</tspan></text>
<text x="18" y="216" xml:space="preserve"><tspan fill="#d6d8df">   7  Find free pool slots</tspan></text>
<text x="18" y="235" xml:space="preserve"><tspan fill="#d6d8df">   8  Auto groups</tspan></text>
<text x="18" y="254" xml:space="preserve"><tspan fill="#d6d8df">   9  Plugins</tspan></text>
<text x="18" y="273" xml:space="preserve"><tspan fill="#d6d8df">  10  Macros</tspan></text>
<text x="18" y="292" xml:space="preserve"><tspan fill="#d6d8df">  11  Run a command file (batch)</tspan></text>
<text x="18" y="311" xml:space="preserve"><tspan fill="#d6d8df">  12  Backup the show</tspan></text>
<text x="18" y="330" xml:space="preserve"><tspan fill="#d6d8df">  13  System monitor (Ctrl+C to stop)</tspan></text>
<text x="18" y="349" xml:space="preserve"><tspan fill="#d6d8df">  14  Command shell</tspan></text>
<text x="18" y="368" xml:space="preserve"><tspan fill="#d6d8df">   0  Quit</tspan></text>
<text x="18" y="387" xml:space="preserve"><tspan fill="#d6d8df">Choose: </tspan><tspan fill="#7fd4ff" font-weight="bold">9</tspan></text>
<text x="18" y="406" xml:space="preserve"></text>
<text x="18" y="425" xml:space="preserve"><tspan fill="#ffcf6b">== Plugins</tspan></text>
<text x="18" y="444" xml:space="preserve"></text>
<text x="18" y="463" xml:space="preserve"><tspan fill="#d6d8df">Plugins</tspan></text>
<text x="18" y="482" xml:space="preserve"><tspan fill="#d6d8df">  1  List</tspan></text>
<text x="18" y="501" xml:space="preserve"><tspan fill="#d6d8df">  2  Install</tspan></text>
<text x="18" y="520" xml:space="preserve"><tspan fill="#d6d8df">  3  Update (load edited files)</tspan></text>
<text x="18" y="539" xml:space="preserve"><tspan fill="#d6d8df">  4  Remove</tspan></text>
<text x="18" y="558" xml:space="preserve"><tspan fill="#d6d8df">  5  Run</tspan></text>
<text x="18" y="577" xml:space="preserve"><tspan fill="#d6d8df">  0  Back</tspan></text>
<text x="18" y="596" xml:space="preserve"><tspan fill="#d6d8df">Choose: </tspan><tspan fill="#7fd4ff" font-weight="bold">1</tspan></text>
<text x="18" y="615" xml:space="preserve"><tspan fill="#d6d8df">Plugin           Installed   Description</tspan></text>
<text x="18" y="634" xml:space="preserve"><tspan fill="#d6d8df">---------------  ----------  ------------------------------------------------------------------------------------------</tspan></text>
<text x="18" y="653" xml:space="preserve"><tspan fill="#d6d8df">ma2kit_api_dump  Plugin 101  List the Lua environment: version, standard libraries and every gma.* function. Read-only.</tspan></text>
<text x="18" y="672" xml:space="preserve"><tspan fill="#d6d8df">ma2kit_info      Plugin 100  Print console, show and selection info. Read-only; used to test the plugin pipeline.</tspan></text>
<text x="18" y="691" xml:space="preserve"><tspan fill="#d6d8df">ma2kit_inspect   Plugin 102  Print class, children and properties of objects in the show tree. Read-only.</tspan></text>
<text x="18" y="710" xml:space="preserve"></text>
<text x="18" y="729" xml:space="preserve"><tspan fill="#d6d8df">Other plugins in this show: 1: LUA</tspan></text>
</g>
</svg>
