<text x="324" y="22" fill="#8a8f9c" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle">ma2kit  —  Show summary</text>
<g font-family="Cascadia Mono, Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="14">
<text x="18" y="64" xml:space="preserve"><tspan fill="#ffcf6b">ma2kit - grandMA2 toolkit</tspan></text>
<text x="18" y="83" xml:space="preserve"><tspan fill="#d6d8df">  127.0.0.1:30000  user toolkit  show demo_show (may be changed)</tspan></text>
<text x="18" y="102" xml:space="preserve"><tspan fill="#d6d8df">   1  Status check (connection, login, show)</tspan></text>
<text x="18" y="121" xml:space="preserve"><tspan fill="#d6d8df">   2  Show summary</tspan></text>
<text x="18" y="140" xml:space="preserve"><tspan fill="#d6d8df">   3  List fixtures</tspan></text>
<text x="18" y="159" xml:space="preserve"><tspan fill="#d6d8df">   4  Browse a pool</tspan></text>
<text x="18" y="178" xml:space="preserve"><tspan fill="#d6d8df">   5  Group members</tspan></text>
<text x="18" y="197" xml:space="preserve"><tspan fill="#d6d8df">   6  Check the show (patch, names)</tspan></text>
<text x="18" y="216" xml:space="preserve"><tspan fill="#d6d8df">   7  Find free pool slots</tspan></text>
<text x="18" y="235" xml:space="preserve"><tspan fill="#d6d8df">   8  Auto groups</tspan></text>
<text x="18" y="254" xml:space="preserve"><tspan fill="#d6d8df">   9  Plugins</tspan></text>
<text x="18" y="273" xml:space="preserve"><tspan fill="#d6d8df">  10  Macros</tspan></text>
<text x="18" y="292" xml:space="preserve"><tspan fill="#d6d8df">  11  Run a command file (batch)</tspan></text>
<text x="18" y="311" xml:space="preserve"><tspan fill="#d6d8df">  12  Backup the show</tspan></text>
<text x="18" y="330" xml:space="preserve"><tspan fill="#d6d8df">  13  System monitor (Ctrl+C to stop)</tspan></text>
<text x="18" y="349" xml:space="preserve"><tspan fill="#d6d8df">  14  Command shell</tspan></text>
<text x="18" y="368" xml:space="preserve"><tspan fill="#d6d8df">   0  Quit</tspan></text>
<text x="18" y="387" xml:space="preserve"><tspan fill="#d6d8df">Choose: </tspan><tspan fill="#7fd4ff" font-weight="bold">2</tspan></text>
<text x="18" y="406" xml:space="preserve"></text>
<text x="18" y="425" xml:space="preserve"><tspan fill="#ffcf6b">== Show summary</tspan></text>
<text x="18" y="444" xml:space="preserve"><tspan fill="#d6d8df">Show: demo_show   software: 3.9.61.5   user: toolkit</tspan></text>
