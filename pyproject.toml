[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ma2kit"
version = "0.2.0"
description = "Toolkit for grandMA2 onPC: a Telnet CLI plus Lua plugins for effects, patching and pan/tilt normalization"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ma2kit = "ma2kit.cli:main"

[tool.setuptools.packages.find]
include = ["ma2kit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
