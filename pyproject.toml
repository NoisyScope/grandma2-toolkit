[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ma2kit"
version = "0.5.0"
description = "Toolkit for grandMA2 onPC: an MCP server, a Telnet CLI and Lua plugins"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ma2kit = "ma2kit.cli:main"
ma2kit-mcp = "ma2kit.mcp_server:main"

[tool.setuptools.packages.find]
include = ["ma2kit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
